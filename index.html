<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gingle Display</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <header class="top-area">

    <div class="brand">
      <div class="logo">G</div>
      <span>Gingle Display</span>
    </div>

    <div class="tabs" id="tabs"></div>

    <button class="new-tab" onclick="novaAba()">+</button>

  </header>

  <div class="toolbar">

    <button onclick="voltar()">←</button>
    <button onclick="avancar()">→</button>
    <button onclick="recarregar()">⟳</button>
    <button onclick="home()">⌂</button>

    <input
      id="url"
      placeholder="Pesquisar ou digitar endereço"
      onkeydown="if(event.key === 'Enter') navegar()"
    >

    <button onclick="favoritar()">★</button>

  </div>

  <div class="main">

    <aside class="sidebar">

      <button onclick="home()">🏠</button>
      <button onclick="mostrarFavoritos()">⭐</button>
      <button onclick="mostrarHistorico()">🕘</button>

    </aside>

    <section class="browser-area">

      <div id="homePage" class="home-page">

        <h1>Gingle Display</h1>

        <p>Pesquise ou acesse seus sites favoritos</p>

        <input
          id="homeSearch"
          placeholder="Pesquisar..."
          onkeydown="if(event.key === 'Enter') pesquisarHome()"
        >

        <div class="shortcuts">

          <div onclick="abrirAtalho('https://www.google.com')">
            Google
          </div>

          <div onclick="abrirAtalho('https://www.youtube.com')">
            YouTube
          </div>

          <div onclick="abrirAtalho('https://github.com')">
            GitHub
          </div>

          <div onclick="abrirAtalho('https://discord.com')">
            Discord
          </div>

        </div>

        <div class="clock" id="clock"></div>

      </div>

      <iframe
        id="browser"
        src="about:blank">
      </iframe>

    </section>

    <aside class="side-panel" id="sidePanel">

      <h3 id="panelTitle">Favoritos</h3>

      <div id="panelContent"></div>

    </aside>

  </div>

  <script src="app.js"></script>

</body>
</html>
